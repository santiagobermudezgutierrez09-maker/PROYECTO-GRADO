<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        // A smaller width makes the page appear larger; a larger width makes it smaller.
        const PHONE_DESKTOP_VIEWPORT_WIDTH = 1024;
        const hasCoarsePointer =
          window.matchMedia("(pointer: coarse)").matches ||
          navigator.maxTouchPoints > 0;
        const isPhone = Math.min(screen.width, screen.height) <= 480;

        if (hasCoarsePointer && isPhone) {
          document.documentElement.classList.add("is-phone-desktop-mode");
          document
            .querySelector('meta[name="viewport"]')
            .setAttribute(
              "content",
              `width=${PHONE_DESKTOP_VIEWPORT_WIDTH}, initial-scale=1`,
            );
        }
      })();
    </script>
    <meta
      name="description"
      content="Descubre Charin Cook, tu recetario digital de postres: encuentra recetas, explora sabores del mundo y cocina paso a paso de forma fácil, práctica y deliciosa."
    />
    <link rel="canonical" href="https://charincook.vercel.app/" />
    <meta property="og:title" content="Charin Cook | Recetas y postres" />
    <meta
      property="og:description"
      content="Descubre Charin Cook, tu recetario digital de postres: encuentra recetas, explora sabores del mundo y cocina paso a paso de forma fácil, práctica y deliciosa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://charincook.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fredoka:wght@500;600;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#E8A583" />
    <title>Charin Cook | Recetas y postres</title>
  </head>

  </body>
</html>
